packages:
  - "apps/*"
  - "packages/*"
onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - "prisma"
  - "@tailwindcss/oxide"
  - "sharp"
  - "electron"
  - "esbuild"
  - "unrs-resolver"

# Ghim phiên bản và vá metadata gói.
#
# VÌ SAO NẰM Ở ĐÂY: từ pnpm 10, trường "pnpm" trong package.json không còn được
# đọc nữa — pnpm bỏ qua trong im lặng và chỉ in một dòng cảnh báo. Để nguyên ở
# chỗ cũ thì mọi ghim bảo mật bên dưới đều vô hiệu mà không ai biết.
overrides:
  "@expo/cli>glob": "10.5.0"
  "@expo/cli>tar": "7.5.22"
  "@expo/config>glob": "10.5.0"
  "@expo/config-plugins>glob": "10.5.0"
  "@expo/metro-config>glob": "10.5.0"
  "@expo/metro-config>postcss": "8.5.23"
  "@expo/plist>@xmldom/xmldom": "0.8.13"
  "@nestjs/config>lodash": "4.18.1"
  "ajv>fast-uri": "3.1.4"
  "cacache@18.0.4>tar": "7.5.22"
  "brace-expansion": "file:./packages/brace-expansion-compat"
  "next>postcss": "8.5.23"
  "next>sharp": "0.35.3"
  "qs": "6.15.2"
  "uuid": "11.1.1"

packageExtensions:
  "@react-native-community/netinfo@11.4.1":
    peerDependencies:
      react: "*"
