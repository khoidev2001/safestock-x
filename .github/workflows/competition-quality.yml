name: Competition quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-quality:
    name: Node, web, mobile and desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # pnpm phải có trên PATH TRƯỚC setup-node: bước `cache: pnpm` gọi `pnpm store
      # path` để tìm cache dir, nếu chưa cài pnpm sẽ fail "Unable to locate
      # executable file: pnpm". Runner ubuntu-latest có sẵn Node nên corepack chạy
      # được ngay cả trước setup-node.
      - name: Enable the pinned package manager
        run: corepack enable && corepack prepare pnpm@10.32.1 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: 20.13.1
          cache: pnpm

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        # `@prisma/client` cài về là stub: các enum sinh từ schema (MissionStatus,
        # LoanStatus, UserRole, NotificationKind, TransactionSource…) và các thành
        # viên namespace Prisma (InputJsonValue, DbNull, PrismaClientKnownRequestError)
        # CHỈ tồn tại sau `prisma generate`. Repo không có postinstall hook nên phải
        # chạy tường minh — nếu không, lint/prisma validate/jest/build đều fail compile
        # trên checkout sạch (local pass vì client đã được generate từ lần trước). Cần
        # DATABASE_URL resolve khi parse schema (không kết nối DB).
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
        run: pnpm --filter @safestock/backend exec prisma generate

      - name: Build shared workspace packages
        # shared-types phát hành qua dist/ (gitignored). Consumers (backend/frontend
        # build) resolve theo main=dist/index.js nên phải build TRƯỚC.
        #
        # scenario-definitions đã được gỡ khỏi workspace. Bước build nó từng nằm ở
        # đây và vẫn "xanh" vì pnpm trả exit 0 khi filter không khớp package nào —
        # nghĩa là CI có thể im lặng bỏ qua một bước build hỏng. Giữ mỗi bước build
        # trỏ tới package có thật để lần sau lệch tên là CI đỏ ngay.
        run: pnpm --filter @safestock/shared-types build

      - name: Reject production dependency advisories
        run: pnpm audit --prod --audit-level=low

      - name: Verify patched dependency compatibility
        run: pnpm --filter ./packages/brace-expansion-compat test:compat

      - name: Lint all workspaces
        run: pnpm lint

      - name: Validate Prisma schema
        # `prisma validate` chỉ parse schema (không kết nối DB) nhưng vẫn cần
        # env("DATABASE_URL") resolve được, nếu không sẽ P1012. CI không có
        # apps/backend/.env nên cấp placeholder ở phạm vi step. Backend jest/build
        # không đọc biến này (unit test mock Prisma, build là tsc) nên không cần.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
        run: pnpm --filter @safestock/backend exec prisma validate

      - name: Backend unit and contract tests
        # exec jest trực tiếp: `test -- --runInBand` bị pnpm 10.32.1 forward "--" thành
        # tham số jest ("jest -- --runInBand") → jest coi là test-path pattern, "No tests
        # found" và exit 1. Dùng exec để chạy đúng 94 suite.
        run: pnpm --filter @safestock/backend exec jest --runInBand

      - name: Build backend
        run: pnpm --filter @safestock/backend build

      - name: Shared coordination contract
        run: |
          pnpm --filter @safestock/shared-types test:coordination
          pnpm --filter @safestock/shared-types test:briefing

      - name: Frontend state contracts and production build
        run: |
          pnpm --filter @safestock/frontend test:mission-inbox
          pnpm --filter @safestock/frontend test:map-marker-state
          pnpm --filter @safestock/frontend test:map-labels
          pnpm --filter @safestock/frontend test:workflow-progress
          pnpm --filter @safestock/frontend test:audio-wav
          pnpm --filter @safestock/frontend test:session-marker
          pnpm --filter @safestock/frontend test:warehouse-progress
          pnpm --filter @safestock/frontend test:notification-routing
          pnpm --filter @safestock/frontend build

      - name: Mobile state and dependency contracts
        run: |
          pnpm --filter @safestock/mobile test:state
          pnpm --filter @safestock/mobile test:resolution
          pnpm --filter @safestock/desktop test:login-error

      - name: Desktop typecheck and bundle
        run: |
          pnpm --filter @safestock/desktop typecheck
          pnpm --filter @safestock/desktop test:queue
          pnpm --filter @safestock/desktop build

      - name: Offline routing artifact contracts
        run: pnpm osrm:test

  ai-quality:
    name: AI service contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai-service/requirements.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest && python -m pip install -r apps/ai-service/requirements.txt

      - name: Run AI safety and behaviour tests
        working-directory: apps/ai-service
        run: python -m pytest -q
