# Keep this file out of production as-is. Copy its structure into the
# cloudflared configuration that belongs to the warehouse server; never commit
# a tunnel credential JSON or a Cloudflare API token.
tunnel: REPLACE_WITH_TUNNEL_UUID
credentials-file: C:\\Windows\\System32\\config\\systemprofile\\.cloudflared\\REPLACE_WITH_TUNNEL_UUID.json

ingress:
  # Public authenticated API origin proxied by the Cloudflare Worker for the
  # user-facing /api and /socket.io paths. Do not point browser clients here.
  - hostname: api.ungphonhanh.life
    service: http://127.0.0.1:3100
  - service: http_status:404
