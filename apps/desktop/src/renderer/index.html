<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      App demo local, admin-only: nới script-src cho HMR/module của Vite (dev) khỏi vỡ,
      nhưng giới hạn connect-src về HTTP/WS LAN (nhập IP backend để demo). Không tải tài
      nguyên ngoài. Chấp nhận đánh đổi cho công cụ giả lập chạy nội bộ.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' http: ws:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'"
    />
    <title>Ứng phó nhanh — Giả lập cảm biến</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
