<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ứng phó nhanh — API</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #e2e8f0;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .card {
        max-width: 480px;
        width: calc(100% - 32px);
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 32px;
        text-align: center;
      }
      h1 {
        margin: 12px 0 4px;
        font-size: 22px;
      }
      p {
        margin: 4px 0;
        color: #94a3b8;
        font-size: 14px;
        line-height: 1.6;
      }
      .badge {
        display: inline-block;
        margin-top: 4px;
        padding: 4px 12px;
        border-radius: 999px;
        background: rgba(34, 197, 94, 0.15);
        color: #22c55e;
        font-size: 12px;
        font-weight: 600;
      }
      .links {
        margin-top: 20px;
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }
      a {
        color: #93c5fd;
        text-decoration: none;
        font-size: 13px;
        padding: 8px 14px;
        border: 1px solid #334155;
        border-radius: 8px;
        transition: background 0.15s;
      }
      a:hover {
        background: #273449;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">API đang chạy</span>
      <h1>Ứng phó nhanh</h1>
      <p>
        Đây là dịch vụ API của hệ thống. Giao diện người dùng chạy ở ứng dụng web/desktop riêng.
      </p>
      <div class="links">
        <a href="/api/health">Kiểm tra trạng thái</a>
      </div>
    </main>
  </body>
</html>
